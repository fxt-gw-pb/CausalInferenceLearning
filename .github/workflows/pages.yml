name: Test and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install schema validator
        run: python3 -m pip install 'jsonschema>=4,<5'
      - name: Check JavaScript syntax
        run: |
          node --check src/app.js
          node --check src/math.js
          node --check src/state.js
      - name: Test content and application logic
        run: npm test
      - name: Build public site
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload public build only
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
